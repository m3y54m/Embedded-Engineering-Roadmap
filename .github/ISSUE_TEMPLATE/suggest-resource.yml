name: Suggest a resource
description: Propose a link to add to the roadmap
title: "[Resource] "
labels: ["enhancement"]
body:
  - type: input
    id: url
    attributes:
      label: Link
      placeholder: https://
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Where does it belong?
      description: The README section, for example "Microcontrollers > Interrupts".
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why add it?
      description: One or two sentences. Mention if it is paid or aimed at beginners.
    validations:
      required: true
