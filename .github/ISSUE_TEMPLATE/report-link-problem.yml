name: Report a link problem
description: A link is broken, outdated, mislabeled or in the wrong section
title: "[Link] "
labels: ["bug"]
body:
  - type: input
    id: entry
    attributes:
      label: Which link?
      description: The title or URL of the entry.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and what should happen to it?
      description: For example "returns 404, replace with <link>" or "belongs under Debugging".
    validations:
      required: true
