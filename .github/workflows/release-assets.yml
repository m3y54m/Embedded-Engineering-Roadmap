name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the files to (leave empty to only build them as an artifact)
        required: false
  push:
    paths:
      - "*.vsdx"
      - ".github/workflows/release-assets.yml"
  pull_request:
    paths:
      - "*.vsdx"
      - ".github/workflows/release-assets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render diagram
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}

      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-draw poppler-utils imagemagick fonts-crosextra-carlito python3-fonttools

      # The diagram uses Sofia Sans Semi Condensed (OFL); Carlito stands in for Calibri.
      - name: Install diagram font
        run: |
          url="https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/sofiasanssemicondensed/SofiaSansSemiCondensed%5Bwght%5D.ttf"
          curl -fsSL -o SofiaSansSemiCondensed.ttf "$url"
          echo "7942e1c0b370cb5fe8dbf3584a3f38a913ad84a27e13e74ccd0e547e43d57a1f  SofiaSansSemiCondensed.ttf" | sha256sum -c -
          mkdir -p ~/.local/share/fonts
          mv SofiaSansSemiCondensed.ttf ~/.local/share/fonts/
          # The diagram also names a separate "... Black" family, which a variable font does not provide.
          python3 -m fontTools varLib.instancer ~/.local/share/fonts/SofiaSansSemiCondensed.ttf wght=900 --update-name-table -o ~/.local/share/fonts/SofiaSansSemiCondensed-Black.ttf
          fc-cache -f
          fc-list | grep -i sofia
          fc-list : family | grep -qx "Sofia Sans Semi Condensed Black"
          fc-match "Calibri"

      - name: Render PDF and PNG
        run: |
          mkdir out
          soffice --headless --convert-to pdf --outdir out Embedded-Engineering-Roadmap.vsdx
          pdftoppm -png -r 300 -singlefile out/Embedded-Engineering-Roadmap.pdf out/page
          convert out/page.png -trim +repage -bordercolor white -border 60 out/Embedded-Engineering-Roadmap.png
          rm out/page.png
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-diagram
          path: out/

      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" out/Embedded-Engineering-Roadmap.pdf out/Embedded-Engineering-Roadmap.png --clobber
